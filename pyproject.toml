[project]
name = "line-trading-bot"
version = "0.1.0"
description = "TradingView trendline alerts -> LLM judgment -> automated exchange orders"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "anthropic>=0.40",
    "tenacity>=8.2",
    "PyNaCl>=1.5",
    "hyperliquid-python-sdk>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["line_trading_bot*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
