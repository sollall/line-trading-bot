name = "line-trading-bot"
main = "src/index.ts"
compatibility_date = "2024-09-25"

# `wrangler d1 create line-trading-bot` の出力の database_id に差し替える
[[d1_databases]]
binding = "DB"
database_name = "line-trading-bot"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# `wrangler kv namespace create DEDUPE_KV` の出力の id に差し替える
[[kv_namespaces]]
binding = "DEDUPE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# 発注APIを叩かない検証モード。実発注を有効化するときだけ "false" にする
PAPER_TRADE = "true"
